sudo: false
language: python
python: 3.11
cache: pip
fast_finish: true
branches:
  only:
  - develop
  - uat
  - prod
install:
  - ./setup_aws_cli.sh || travis_terminate 1
  - pip install "git+https://github.com/seperman/deepdiff.git#egg=deepdiff" aws-sam-translator>=1.50.0 cfn-lint sceptre sceptre-ssm-resolver
stages:
  - name: validate
  - name: deploy
    if: type = push
jobs:
  include:
    - stage: validate
      script: cfn-lint ./templates/**/* --ignore-checks W1011
    - stage: deploy
      script:
        - sceptre launch common --yes
        - sceptre launch $TRAVIS_BRANCH --yes --force
