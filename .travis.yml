sudo: false
language: python
python: 3.11
cache: pip
fast_finish: true
branches:
  only:
  - develop
  - uat
  - prod
install:
  - ./setup_aws_cli.sh || travis_terminate 1
  # Install separately + pin sceptre>=4: unbounded `sceptre` resolves to a 2.x that requires PyYAML<6,
  # which builds from source under Cython 3 and fails ("'build_ext' object has no attribute
  # 'cython_sources'"). sceptre>=4 accepts the PyYAML 6.0.1 wheel. Mirrors BWP-infra's known-good install.
  - pip install --upgrade pip setuptools wheel
  - pip install PyYAML==6.0.1
  - pip install deepdiff@git+https://github.com/seperman/deepdiff.git
  - pip install aws-sam-translator>=1.50.0
  - pip install cfn-lint
  - pip install sceptre>=4
  - pip install sceptre-ssm-resolver
stages:
  - name: validate
  - name: deploy
    if: type = push
jobs:
  include:
    - stage: validate
      # W3005: redundant DependsOn already enforced by a Ref (pre-existing, bridgeserver2-antivirus.yaml);
      # a benign style warning newly surfaced by cfn-lint 1.57. Ignored (like W1011) - no CFN change.
      script: cfn-lint ./templates/**/* --ignore-checks W1011 W3005
    - stage: deploy
      script:
        - sceptre launch common --yes
        - sceptre launch $TRAVIS_BRANCH --yes
